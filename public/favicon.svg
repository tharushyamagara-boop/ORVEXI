<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="oxGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle rounded base -->
  <rect width="64" height="64" rx="14" fill="#0c0e17" />
  <rect width="64" height="64" rx="14" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Stylized Geometric 'O' & 'X' Nexus Icon -->
  <g filter="url(#glow)">
    <!-- Outer Hex Prism Orbit -->
    <path d="M32 10 L50 20 L50 42 L32 52 L14 42 L14 20 Z" 
          stroke="url(#oxGrad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
    <!-- Core Cross Convergence (X Core) -->
    <path d="M22 23 L42 41 M42 23 L22 41" 
          stroke="url(#oxGrad2)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Central Energy Node -->
    <circle cx="32" cy="32" r="3.5" fill="#38bdf8" />
  </g>
</svg>
